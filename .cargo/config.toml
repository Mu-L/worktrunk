# Set terminal width for deterministic test output.
# Unit tests call terminal_width() in-process and need this env var.
# Integration tests override with COLUMNS=150 in their command setup.
[env]
COLUMNS = "80"

# Deny the developer's git config to every `git` the test suite spawns, and
# supply the settings the suite needs in its place — all as environment, with
# no file on disk.
#
# An in-process test drives git through the test process's own environment —
# `Repository::run_command` builds a plain `Cmd::new("git")`, so there is no
# per-command hook the fixtures can reach. A variable can only be set before
# the process starts, so this is the one layer that covers in-process git.
# `configure_git_env` restates the two deny vars per command, and
# `isolate_subprocess_env` lets every `GIT_CONFIG_*` pass through to `wt`
# children rather than scrubbing it.
#
# Without it the suite reads whatever the developer configured — `commit.gpgsign`
# fails every fixture commit, `core.hooksPath` runs their hooks, `core.fsmonitor`
# and `credential.helper` run programs of their choosing — and a conditional
# `includeIf "gitdir:…"` makes which of those happens depend on where `$TMPDIR`
# sits.
#
# The deny pair names a path that does not exist, matching
# `DEFAULT_ISOLATED_USER_CONFIG`. Git reads a missing config file as an empty
# one; only an explicit `--global`/`--system` read of it fails, and nothing in
# `wt` performs one. `force` so an exported value can't reinstate the host's
# config.
GIT_CONFIG_GLOBAL = { value = "/nonexistent/wt/gitconfig", force = true }
GIT_CONFIG_SYSTEM = { value = "/nonexistent/wt/gitconfig", force = true }

# `GIT_CONFIG_COUNT` + `GIT_CONFIG_KEY_n`/`GIT_CONFIG_VALUE_n` are git's
# environment spelling of `-c`, so this applies wherever the deny pair does.
#
# Only `useConfigOnly` is here, because it is the only setting that has work to
# do once the host's config is denied. It stops git *guessing* an identity from
# the OS username and hostname when none is configured, which is the one way a
# hermetic suite could still author a commit as the developer. Nothing exercises
# it — every path sets an identity — so it is a backstop, and the reason to keep
# it is that without it a future gap goes silent instead of failing.
#
# `commit.gpgsign`, `advice.mergeConflict`, `advice.resolveConflict` and
# `rerere.enabled` were here and are gone: they predate the denial, which
# already puts git on its own defaults for all four. Disabling the whole set and
# running 4,611 tests failed nothing but the assertion on this list's contents.
#
# That spelling also sets their precedence: `-c` outranks a repository's own
# config, where a global *file* would yield to it. So a key belongs here only
# when no test needs to override it locally — which is why `init.defaultBranch`
# does not, and every `git init` in the harness names its branch instead:
# `default_branch.rs` sets that key in a repo to prove `wt` reads it, and an
# entry here would silently win.
#
# There is deliberately no identity. Cargo applies this table to a developer's
# `cargo run -- <cmd>` as much as to the suite, so a name here would author
# their commits as `Test User`; without one, `useConfigOnly` fails that commit
# instead. Tests get their identity from `git_test_env` (harness-built git) and
# `LOCAL_TEST_CONFIG` (in-process git).
GIT_CONFIG_COUNT = { value = "1", force = true }
GIT_CONFIG_KEY_0 = { value = "user.useConfigOnly", force = true }
GIT_CONFIG_VALUE_0 = { value = "true", force = true }
