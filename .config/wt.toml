[post-start]
# Copy target/ from main worktree using CoW (~3s vs ~68s full rebuild)
deps = "wt step copy-ignored"
assets = "task fetch-assets"
# `zola serve` runs forever; tether kills its whole process tree when the
# worktree is removed (any path — `wt remove`, `git worktree remove`, `rm -rf`),
# so no `pre-remove`/`post-remove` cleanup is needed. `-C docs` runs zola in the
# docs subdir; the worktree root is still what teardown watches.
docs = "wt step tether -C docs -- zola serve -p {{ branch | hash_port }}"

[post-merge]
clippy = "pre-commit run clippy --all-files || true"
build = "cargo test --no-run --all-targets --locked --all-features"
install = "cargo install --path ."
sync = 'if [ "{{ target }}" = "main" ]; then git pull && git push; fi'

[[pre-merge]]
# Assert Cargo.lock is in sync with Cargo.toml before anything builds. Must be
# first: a preceding unlocked cargo command (the insta hook's test runner, or a
# pre-commit hook) would silently regenerate a stale lock and mask this check.
# `--workspace` reconciles the lock against the manifests only; plain
# `cargo update --locked` would also fail on dependencies merely behind latest.
lockfile = "cargo update --workspace --locked"
pre-commit = "pre-commit run --all-files"
# No `RUSTFLAGS='-D warnings'` here. The pre-commit step in this same gate runs
# `cargo clippy --all-targets --all-features -- -D warnings`, which fails on any
# rustc warning in every target this step builds, over a superset of its
# features. Setting RUSTFLAGS only added coverage of third-party dependencies,
# which we don't want to gate on, and RUSTFLAGS is part of cargo's fingerprint:
# it forked the entire 343-crate graph into a second set of artifacts, ~260 CPU-
# seconds to prime and a duplicate of `target/debug/deps` to keep. In CI it also
# shadowed the workflow-level `RUSTFLAGS: -C debuginfo=0`, so the largest build
# in the run was the one carrying full debug info.
insta = """cargo insta test --test-runner nextest --dnd --check $([ "$(uname)" = 'Linux' ] && echo '--unreferenced reject') --features shell-integration-tests"""
doctest = "RUSTDOCFLAGS='-Dwarnings' cargo test --doc"
doc = "RUSTDOCFLAGS='-Dwarnings' cargo doc --no-deps --document-private-items"

[list]
url = "http://127.0.0.1:{{ branch | hash_port }}"
